tagline: Candy-size single-channel ElectroMyography (EMG) sensor
image: hardware/bioamp/muscle-bioamp-candy/media/Muscle-BioAmp-Candy-front.jpg

overview: >-
  A candy-size single-channel ElectroMyography (EMG) sensor for recording of muscle
  signals at an affordable cost. It is an SMD version of Muscle BioAmp BisCute that can be
  used to make amazing Human-Computer Interface (HCI) projects.

specifications:
  - [Minimum Input Voltage, 3.3-30 V]
  - [Input Impedance, 10^11 ohm]
  - [Fixed Gain, x2420]
  - [Bandpass Filter, 72 – 720 Hz]
  - [Compatible Hardware, "Any development board with an ADC (Arduino UNO & Nano, Adafruit QtPy, STM32 Blue Pill, BeagleBone Black, Raspberry Pi Pico, to name just a few)"]
  - [BioPotentials, EMG (Electromyography)]
  - [No. of Channels, "1"]
  - [Electrodes, "3 (Positive, Negative, and Reference)"]
  - [Dimensions, 3.5 x 1.5 cm]
  - [Open Source, Hardware + Software]
