tagline: Affordable DIY ElectroMyography (EMG) sensor for Human-Computer Interface projects
image: hardware/bioamp/muscle-bioamp-biscute/media/Muscle_BioAmp_BisCute.jpg

overview: >-
  Muscle BioAmp BisCute is the most affordable DIY ElectroMyography (EMG) sensor in the
  world that allows you to create a Human-Computer Interface (HCI) projects with ease. In
  the process of building your own BisCute, you learn what goes into making a functional
  biopotential amplifier that can be used for amplifying sub mV signals generated by
  muscles inside your body to a level a microcontroller unit (MCU) can understand.

specifications:
  - [Minimum Input Voltage, 3.3-30 V]
  - [Input Impedance, 10^11 ohm]
  - [Fixed Gain, x2420]
  - [Bandpass Filter, 72 – 720 Hz]
  - [Compatible Hardware, "Any development board with an ADC (Arduino UNO & Nano, Adafruit QtPy, STM32 Blue Pill, BeagleBone Black, Raspberry Pi Pico, to name just a few) or any standalone ADC of your choice"]
  - [BioPotentials, EMG (Electromyography)]
  - [No. of Channels, "1"]
  - [Electrodes, "3 (Positive, Negative, and Reference)"]
  - [Dimensions, 3.0 x 4.5 cm]
  - [Open Source, Hardware + Software]
